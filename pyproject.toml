[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "furhat-demos"
version = "0.1.6"
description = "Furhat robot demos for University of Melbourne Open Day: LLM Q&A personas and FaceVis data visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "furhat-remote-api>=1.0",
    "openai>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/furhat_demos"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/furhat_demos --cov-report=term-missing --cov-fail-under=80"

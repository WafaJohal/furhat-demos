<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Furhat Demos</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      background: #ffffff;
      color: #111111;
    }
    h1 { margin-bottom: 0.25rem; }
    p { color: #333333; }
    .demo { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .demo h2 { margin-top: 0; }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
    button {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #fff;
      color: #111;
      cursor: pointer;
    }
    button:hover { background: #eee; }
    #status { margin-top: 1.5rem; font-weight: bold; min-height: 1.5rem; }

    .robot-panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .robot-panel input {
      padding: 0.5rem 0.6rem;
      border: 1px solid #999;
      border-radius: 6px;
      font-size: 1rem;
      width: 12rem;
    }
    .dot {
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 50%;
      background: #999;
      flex-shrink: 0;
    }
    .dot.connected { background: #2a9d3f; }
    .dot.disconnected { background: #c0392b; }
    #robot-status-text { font-weight: 600; }
    #robot-error { color: #c0392b; font-size: 0.9rem; width: 100%; }
    .admin-link { margin-top: 2rem; font-size: 0.85rem; }
    .admin-link a { color: #666; }
  </style>
</head>
<body>
  <h1>Furhat Demos</h1>
  <p>Pick a demo, then an option, to start it on the robot.</p>

  <div class="robot-panel">
    <span class="dot" id="robot-dot"></span>
    <span id="robot-status-text">Checking…</span>
    <input id="robot-host" type="text" placeholder="Robot IP, e.g. 172.20.10.10" />
    <input id="robot-auth-key" type="password" placeholder="Auth key (if required)" />
    <button id="robot-connect-btn">Connect</button>
    <span id="robot-error"></span>
  </div>

  <div id="demos"></div>
  <div id="status"></div>

  <p class="admin-link"><a href="/admin">Admin</a></p>

  <script>
    async function loadDemos() {
      const res = await fetch('/api/demos');
      const demos = await res.json();
      const container = document.getElementById('demos');
      container.innerHTML = '';
      for (const demo of demos) {
        const section = document.createElement('div');
        section.className = 'demo';

        const heading = document.createElement('h2');
        heading.textContent = demo.name;

        const desc = document.createElement('p');
        desc.textContent = demo.description;

        const options = document.createElement('div');
        options.className = 'options';
        for (const option of demo.options) {
          const btn = document.createElement('button');
          btn.textContent = option.name;
          btn.title = option.description;
          btn.addEventListener('click', () => selectOption(demo.id, option.id));
          options.appendChild(btn);
        }

        section.append(heading, desc, options);
        container.appendChild(section);
      }
    }

    async function selectOption(demoId, optionId) {
      const status = document.getElementById('status');
      status.textContent = 'Starting...';
      try {
        const res = await fetch('/api/select', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ demo_id: demoId, option_id: optionId }),
        });
        if (res.ok) {
          const data = await res.json();
          status.textContent = `Started: ${data.demo_id} / ${data.option_id}`;
        } else {
          status.textContent = 'Failed to start demo.';
        }
      } catch (err) {
        status.textContent = 'Failed to start demo.';
      }
    }

    function renderRobotStatus(state) {
      const dot = document.getElementById('robot-dot');
      const text = document.getElementById('robot-status-text');
      const error = document.getElementById('robot-error');
      dot.className = 'dot ' + (state.connected ? 'connected' : 'disconnected');
      text.textContent = state.connected
        ? `Connected to ${state.host}`
        : (state.host ? `Not connected to ${state.host}` : 'Not connected');
      error.textContent = state.connected ? '' : (state.error || '');
    }

    async function refreshRobotStatus() {
      try {
        const res = await fetch('/api/robot/status');
        renderRobotStatus(await res.json());
      } catch (err) {
        // Leave the last known status showing rather than clearing it.
      }
    }

    async function connectRobot() {
      const hostInput = document.getElementById('robot-host');
      const authKeyInput = document.getElementById('robot-auth-key');
      const host = hostInput.value.trim();
      const authKey = authKeyInput.value.trim();
      if (!host) return;
      document.getElementById('robot-status-text').textContent = 'Connecting…';
      try {
        const res = await fetch('/api/robot/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host, auth_key: authKey || null }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          renderRobotStatus({ connected: false, host, error: data.detail });
          return;
        }
      } catch (err) {
        renderRobotStatus({ connected: false, host, error: 'Request failed.' });
        return;
      }
      await refreshRobotStatus();
    }

    document.getElementById('robot-connect-btn').addEventListener('click', connectRobot);

    loadDemos();
    refreshRobotStatus();
    setInterval(refreshRobotStatus, 10000);
  </script>
</body>
</html>

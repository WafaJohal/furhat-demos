<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Furhat Demos — Admin</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
      background: #ffffff;
      color: #111111;
    }
    h1 { margin-bottom: 0.25rem; }
    p { color: #333333; }
    a { color: #1a5fb4; }
    .upload-panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1rem;
      margin: 1.5rem 0;
    }
    button {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      border: 1px solid #333;
      background: #fff;
      color: #111;
      cursor: pointer;
    }
    button:hover { background: #eee; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin: 0.4rem 0;
    }
    .delete-btn { border-color: #c0392b; color: #c0392b; }
    #upload-status { margin-top: 0.75rem; min-height: 1.2rem; }
    #upload-status.error { color: #c0392b; }
  </style>
</head>
<body>
  <p><a href="/">&larr; Back to demos</a></p>
  <h1>Admin: Open Day content</h1>
  <p>Upload a PDF to add it to the Open Day Q&amp;A's knowledge base. Uploaded content is shared across all visitors.</p>

  <div class="upload-panel">
    <input id="pdf-input" type="file" accept="application/pdf" />
    <button id="upload-btn">Upload</button>
    <div id="upload-status"></div>
  </div>

  <h2>Uploaded documents</h2>
  <ul id="document-list"></ul>

  <script>
    async function loadDocuments() {
      const res = await fetch('/api/admin/documents');
      const docs = await res.json();
      const list = document.getElementById('document-list');
      list.innerHTML = '';
      if (docs.length === 0) {
        list.innerHTML = '<li>No documents uploaded yet.</li>';
        return;
      }
      for (const doc of docs) {
        const li = document.createElement('li');
        const name = document.createElement('span');
        name.textContent = doc.filename;
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.className = 'delete-btn';
        deleteBtn.addEventListener('click', () => deleteDocument(doc.filename));
        li.append(name, deleteBtn);
        list.appendChild(li);
      }
    }

    async function deleteDocument(filename) {
      await fetch(`/api/admin/documents/${encodeURIComponent(filename)}`, { method: 'DELETE' });
      await loadDocuments();
    }

    async function uploadDocument() {
      const input = document.getElementById('pdf-input');
      const status = document.getElementById('upload-status');
      status.className = '';
      const file = input.files[0];
      if (!file) {
        status.textContent = 'Choose a PDF first.';
        status.className = 'error';
        return;
      }
      status.textContent = 'Uploading…';
      const formData = new FormData();
      formData.append('file', file);
      try {
        const res = await fetch('/api/admin/documents', { method: 'POST', body: formData });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          status.textContent = data.detail || 'Upload failed.';
          status.className = 'error';
          return;
        }
        status.textContent = 'Uploaded.';
        input.value = '';
        await loadDocuments();
      } catch (err) {
        status.textContent = 'Upload failed.';
        status.className = 'error';
      }
    }

    document.getElementById('upload-btn').addEventListener('click', uploadDocument);

    loadDocuments();
  </script>
</body>
</html>
